<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSX Portfolio — Login</title>
<style>
:root {
  --bg:        #eef1f6;
  --card:      #ffffff;
  --border:    #cdd5e0;
  --txt:       #0d1829;
  --txt2:      #465873;
  --txt3:      #8898b0;
  --accent:    #1a56db;
  --red:       #b91c1c;
  --red-bg:    rgba(185,28,28,.07);
  --ui:        'Space Grotesk', -apple-system, sans-serif;
  --r:         6px;
  --r2:        10px;
  --shadow:    0 2px 16px rgba(13,24,41,.10), 0 1px 4px rgba(13,24,41,.06);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--ui);background:var(--bg);color:var(--txt);font-size:14px;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
}
.card{
  width:100%;max-width:380px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--r2);box-shadow:var(--shadow);padding:32px;
}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:24px}
.logo-mark{
  width:36px;height:36px;border-radius:var(--r);background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;
}
.logo-text{font-weight:600;font-size:16px}
.logo-sub{font-size:11px;color:var(--txt3)}
h1{font-size:15px;font-weight:600;margin-bottom:4px}
.sub{font-size:12px;color:var(--txt3);margin-bottom:20px}
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:11px;font-weight:600;color:var(--txt2);margin-bottom:5px}
.form-input{
  width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:var(--r);
  font-size:13px;background:var(--bg);color:var(--txt);
}
.form-input:focus{outline:none;border-color:var(--accent)}
.btn{
  width:100%;padding:10px;border:none;border-radius:var(--r);background:var(--accent);
  color:#fff;font-size:13px;font-weight:600;cursor:pointer;margin-top:6px;
}
.btn:disabled{opacity:.6;cursor:not-allowed}
.toggle-row{text-align:center;font-size:12px;color:var(--txt3);margin-top:16px}
.toggle-row a{color:var(--accent);cursor:pointer;text-decoration:none;font-weight:600}
.error-box{
  display:none;background:var(--red-bg);border:1px solid var(--red);color:var(--red);
  border-radius:var(--r);padding:9px 11px;font-size:12px;margin-bottom:14px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#0f1420; --card:#161c2b; --border:#2a3346; --txt:#e6ebf5; --txt2:#a9b6cc;
    --txt3:#6d7c99; --accent:#4f83f0; --red-bg:rgba(239,68,68,.12);
  }
}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-mark">PSX</div>
    <div>
      <div class="logo-text">Portfolio Dashboard</div>
      <div class="logo-sub">Pakistan Stock Exchange</div>
    </div>
  </div>

  <h1 id="formTitle">Log in</h1>
  <div class="sub" id="formSub">Access your portfolio</div>

  <div class="error-box" id="errorBox"></div>

  <form id="authForm">
    <div class="form-group">
      <label class="form-label">Username</label>
      <input type="text" id="fUsername" class="form-input" autocomplete="username" required>
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input type="password" id="fPassword" class="form-input" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn" id="submitBtn">Log In</button>
  </form>

  <div class="toggle-row">
    <span id="toggleText">Don't have an account?</span> <a id="toggleLink" onclick="toggleMode()">Register</a>
  </div>
</div>

<script>
let mode = 'login'; // 'login' | 'register'

function toggleMode() {
  mode = mode === 'login' ? 'register' : 'login';
  const isLogin = mode === 'login';
  document.getElementById('formTitle').textContent = isLogin ? 'Log in' : 'Create account';
  document.getElementById('formSub').textContent = isLogin ? 'Access your portfolio' : 'Password must be at least 8 characters';
  document.getElementById('submitBtn').textContent = isLogin ? 'Log In' : 'Register';
  document.getElementById('toggleText').textContent = isLogin ? "Don't have an account?" : 'Already have an account?';
  document.getElementById('toggleLink').textContent = isLogin ? 'Register' : 'Log in';
  document.getElementById('fPassword').autocomplete = isLogin ? 'current-password' : 'new-password';
  hideError();
}

function showError(msg) {
  const box = document.getElementById('errorBox');
  box.textContent = msg;
  box.style.display = 'block';
}
function hideError() {
  document.getElementById('errorBox').style.display = 'none';
}

document.getElementById('authForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  hideError();
  const username = document.getElementById('fUsername').value.trim();
  const password = document.getElementById('fPassword').value;
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;

  try {
    const endpoint = mode === 'login' ? '/api/auth/login' : '/api/auth/register';
    const res = await fetch(endpoint, {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });

    if (mode === 'register') {
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        showError(err.error || 'Registration failed.');
        btn.disabled = false;
        return;
      }
      // Registered - now log in to establish the session.
      const loginRes = await fetch('/api/auth/login', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      if (!loginRes.ok) {
        showError('Account created — please log in.');
        toggleMode();
        btn.disabled = false;
        return;
      }
      location.href = '/';
      return;
    }

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      showError(err.error || 'Invalid username or password.');
      btn.disabled = false;
      return;
    }
    location.href = '/';
  } catch (e) {
    showError('Network error — please try again.');
    btn.disabled = false;
  }
});

// If already logged in, skip straight to the app.
fetch('/api/auth/me', { credentials: 'include' }).then(res => {
  if (res.ok) location.href = '/';
});
</script>
</body>
</html>
